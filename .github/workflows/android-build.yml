name: HEART CARE AI APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk

      - name: Set Android SDK
        run: |
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> $GITHUB_ENV

      - name: Extract Android Project
        run: |
          unzip -q heart-care-ai-android-studio.zip -d source
          find source -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd source/heart-care-ai-android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HEART-CARE-AI-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
