name: HEART CARE AI APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android Project
        run: |
          unzip -q heart-care-ai-android-studio.zip -d source
          find source -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd source/heart-care-ai-android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HEART-CARE-AI-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
