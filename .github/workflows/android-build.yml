name: HEART CARE AI APK Build

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
name: Build HEART CARE AI APK
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Check Project ZIP
    run: |
      ls -la
      test -f heart-care-ai-android-studio.zip

  - name: Extract Android Project
    run: |
      mkdir -p source
      unzip -q heart-care-ai-android-studio.zip -d source
      find source -name gradlew -type f

  - name: Build Android APK
    run: |
      cd source/heart-care-ai-android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: HEART-CARE-AI-APK
      path: source/heart-care-ai-android/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
